<div class="login">
  <div class="container">
    <div class="login__content">
      <h1 class="login__title">Войти в личный кабинет</h1>
      <form class="form" [formGroup]='loginForm' (ngSubmit)="onLogin()">
        <label for="email" class="form__item">
          @let emailErrors = getZodErrors('email'); @let invalidEmail = emailErrors.length > 0 &&
          (loginForm.get('email')?.touched || loginForm.get('email')?.dirty);
          <input
            type="email"
            formControlName="email"
            id="email"
            class="form__item-input"
            placeholder="Электронная почта"
             autocomplete="email"
            [style.borderColor]="invalidEmail ? 'red' : ''"
          />
        </label>
        @if(emailErrors.length > 0 && invalidEmail){
        <div class="form__error-block">
          @for ( err of emailErrors; track $index ) {
          <span class="form__error-item">{{ err }}</span>
          }
        </div>
        }
        <label for="password" class="form__item">
          @let passwordErrors = getZodErrors('password'); @let invalidPassword =
          passwordErrors.length > 0 && (loginForm.get('password')?.touched ||
          loginForm.get('password')?.dirty);
          <input
            type="password"
            formControlName="password"
            class="form__item-input"
            id="password"
            placeholder="Пароль"
            autocomplete="password"
            [style.borderColor]="invalidPassword ? 'red' : ''"
          />
        </label>

        @if(passwordErrors.length > 0 && invalidPassword){
        <div class="form__error-block">
          @for ( err of passwordErrors; track $index ) {
          <span class="form__error-item">{{ err }}</span>
          }
        </div>
        }
        <label for="rememberMe" class="form__item-policy">
          <input type="checkbox" class="form__item-checkbox"
          formControlName="rememberMe"
          id="rememberMe"  />
          <span> Запомнить меня </span>
        </label>
        <div class="form__action">
          <button class="btn form__btn" type="submit" [disabled]="!isFormValid()">Войти</button>
        </div>
        <div class="form__login">
          Нет аккаунта? <a class="form__login-link" routerLink="/signup">Пройдите регистрацию</a>
        </div>
      </form>
    </div>
    <div class="login__image">
      <img
        src="/assets/images/auth/login.png
			"
        alt="Картинка регистрации"
      />
    </div>
  </div>
</div>
