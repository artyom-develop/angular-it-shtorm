<app-header></app-header>
<router-outlet></router-outlet>
<app-footer></app-footer>

<!-- Кнопка прокрутки вверх -->
@if (showScrollTop()) {
  <button
    class="scroll-to-top"
    (click)="scrollToTop()"
    aria-label="Прокрутить вверх"
  >
    <svg
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M18 15L12 9L6 15"
        stroke="white"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
}
